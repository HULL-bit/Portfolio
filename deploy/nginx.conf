# SYSTEM//DIAW — serveur statique Nginx (Ubuntu 22.04/24.04)
#
# Installation (voir README.md, section « Déploiement sur un VPS ») :
#   sudo apt install nginx libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static certbot python3-certbot-nginx
#   sudo mkdir -p /var/www/diaw && sudo rsync -a --delete out/ /var/www/diaw/
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/diaw && sudo ln -s /etc/nginx/sites-available/diaw /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d exemple.com -d www.exemple.com     # certificat Let's Encrypt + renouvellement automatique
#   sudo nginx -t && sudo systemctl reload nginx
#
# Remplacer « exemple.com » par le vrai domaine. Le site est servi à la racine (pas de basePath) : build sans NEXT_PUBLIC_BASE_PATH.

# Redirection HTTP → HTTPS (certbot complète/ajuste ce bloc)
server {
    listen 80;
    listen [::]:80;
    server_name exemple.com www.exemple.com;

    location /.well-known/acme-challenge/ { root /var/www/diaw; }
    location / { return 301 https://exemple.com$request_uri; }
}

# www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.exemple.com;

    ssl_certificate     /etc/letsencrypt/live/exemple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemple.com/privkey.pem;
    return 301 https://exemple.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name exemple.com;

    root /var/www/diaw;
    index index.html;
    charset utf-8;

    # ── TLS (Let's Encrypt) ──
    ssl_certificate     /etc/letsencrypt/live/exemple.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exemple.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ── Compression : brotli (préféré) + gzip ──
    brotli on;
    brotli_static on;
    brotli_comp_level 5;
    brotli_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json font/ttf;
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/manifest+json;

    # ── En-têtes de sécurité ──
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # CSP : seules origines tierces autorisées — api.web3forms.com (formulaire) et gc.zgo.at / *.goatcounter.com (statistiques sans cookie).
    #  • 'unsafe-inline' (scripts) : un export statique Next.js embarque ses données d'hydratation dans des <script> inline ; pas de nonce possible sans serveur.
    #  • worker-src blob: : détection GPU (OffscreenCanvas) dans un Web Worker.
    #  • img-src data: : grain filmique (SVG en data-URI).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.goatcounter.com; font-src 'self'; connect-src 'self' https://api.web3forms.com https://*.goatcounter.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://api.web3forms.com; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # ── Routage statique : /fr/ → /fr/index.html, /fr/cv → /fr/cv/index.html ──
    # (on utilise `expires` plutôt que add_header : un add_header dans un location annulerait les en-têtes de sécurité du serveur)
    location / {
        try_files $uri $uri/ $uri.html =404;
        expires epoch;            # Cache-Control: no-cache — pages HTML toujours revalidées (site reconstruit chaque nuit)
    }

    # Assets versionnés par Next.js : cache 1 an
    location /_next/static/ {
        expires 1y;
        try_files $uri =404;
    }

    # Polices, images, données du portrait, images Open Graph, CV : cache long (changent rarement)
    location ~* ^/(fonts|images|data|og|cv)/ {
        expires 30d;
        try_files $uri =404;
    }

    # Page 404 (« kernel panic »)
    error_page 404 /404.html;
    location = /404.html { internal; }

    # Pas d'indexation des fichiers cachés
    location ~ /\. { deny all; }
}
